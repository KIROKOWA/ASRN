<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-label="Dentro de la capa ASRN: un hash ordena las posiciones en casilleros y cada pieza busca en sus compañeros de casillero anteriores; el estado normalizado da la confirmación y un reloj propio; grupos de 1 a 4 piezas alimentan un escaneo que mide repetición; la puerta decide cuánto de lo copiado entra al estado."><style>
  .fondo { fill: #f3f5f4; }
  .caja { fill: #f3f5f4; stroke: #b9c4bf; stroke-width: 1.5; }
  .caja-a { fill: #cfe8e2; stroke: #0d7465; stroke-width: 1.5; }
  .caja-s { fill: #f3dccf; stroke: #b0502a; stroke-width: 1.5; }
  .t { fill: #17201d; font: 700 15px "Segoe UI", Helvetica, Arial, sans-serif; }
  .ts { fill: #56635d; font: 12.5px "Segoe UI", Helvetica, Arial, sans-serif; }
  .tm, .ta, .tsig { font: 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .tm { fill: #56635d; } .ta { fill: #0d7465; } .tsig { fill: #b0502a; }
  .lin { stroke: #56635d; stroke-width: 1.5; fill: none; }
  .lin-a { stroke: #0d7465; stroke-width: 2; fill: none; }
  .lin-s { stroke: #b0502a; stroke-width: 2; fill: none; }
  .disc { stroke: #56635d; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
  .pm { fill: #56635d; } .pa { fill: #0d7465; } .ps { fill: #b0502a; }
  .celda { fill: #f3f5f4; stroke: #b9c4bf; stroke-width: 1.2; }
  .celda-q { fill: #0d7465; stroke: #0d7465; }
  .celda-v { fill: #cfe8e2; stroke: #0d7465; stroke-width: 1.5; }
  .tq { fill: #f3f5f4; font: 500 14px ui-monospace, Menlo, Consolas, monospace; }
  .tc { fill: #17201d; font: 14px ui-monospace, Menlo, Consolas, monospace; }
  @media (prefers-color-scheme: dark) {
    .fondo, .caja, .celda { fill: #101614; } .caja, .celda { stroke: #3b4843; }
    .caja-a, .celda-v { fill: #173a33; stroke: #4cc4ae; } .caja-s { fill: #3f2619; stroke: #e78f62; }
    .t, .tc { fill: #e2eae6; } .ts, .tm { fill: #98a8a1; } .ta { fill: #4cc4ae; } .tsig { fill: #e78f62; }
    .lin, .disc { stroke: #98a8a1; } .lin-a { stroke: #4cc4ae; } .lin-s { stroke: #e78f62; }
    .pm { fill: #98a8a1; } .pa { fill: #4cc4ae; } .ps { fill: #e78f62; }
    .celda-q { fill: #4cc4ae; stroke: #4cc4ae; } .tq { fill: #101614; }
  }
</style><rect class="fondo" x="0" y="0" width="1040" height="520" rx="10"/>
        <defs>
          <marker id="f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="pm"/></marker>
          <marker id="f2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="pa"/></marker>
          <marker id="f2s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ps"/></marker>
        </defs>

        <!-- entradas -->
        <rect class="caja" x="20" y="60" width="90" height="44" rx="8"/>
        <text class="t" x="65" y="87" text-anchor="middle">E</text>
        <rect class="caja" x="20" y="236" width="90" height="44" rx="8"/>
        <text class="t" x="65" y="263" text-anchor="middle">h</text>
        <rect class="caja" x="20" y="412" width="90" height="44" rx="8"/>
        <text class="t" x="65" y="439" text-anchor="middle">piezas</text>

        <!-- carril de busqueda -->
        <rect class="caja-a" x="150" y="52" width="150" height="60" rx="8"/>
        <text class="t" x="225" y="78" text-anchor="middle">hash aprendido</text>
        <text class="ts" x="225" y="98" text-anchor="middle">8 tablas de casilleros</text>
        <rect class="caja-a" x="330" y="52" width="170" height="60" rx="8"/>
        <text class="t" x="415" y="78" text-anchor="middle">ordenar por casillero</text>
        <text class="ts" x="415" y="98" text-anchor="middle">mirar los 32 anteriores</text>
        <rect class="caja-a" x="530" y="52" width="170" height="60" rx="8"/>
        <text class="t" x="615" y="78" text-anchor="middle">puntuar y elegir</text>
        <text class="ts" x="615" y="98" text-anchor="middle">softmax por tabla</text>
        <rect class="caja-a" x="730" y="52" width="120" height="60" rx="8"/>
        <text class="t" x="790" y="78" text-anchor="middle">lo copiado</text>
        <text class="ts" x="790" y="98" text-anchor="middle">promedio</text>

        <line class="lin-a" x1="110" y1="82" x2="148" y2="82" marker-end="url(#f2a)"/>
        <line class="lin-a" x1="300" y1="82" x2="328" y2="82" marker-end="url(#f2a)"/>
        <line class="lin-a" x1="500" y1="82" x2="528" y2="82" marker-end="url(#f2a)"/>
        <line class="lin-a" x1="700" y1="82" x2="728" y2="82" marker-end="url(#f2a)"/>

        <path class="lin" d="M65,60 L65,30 L790,30 L790,50" marker-end="url(#f2)"/>
        <text class="tm" x="430" y="24" text-anchor="middle">valores: el vector de la pieza que vino DESPUÉS</text>

        <!-- sufijo exacto desde las piezas -->
        <path class="lin" d="M20,434 L10,434 L10,140 L550,140 L550,114" marker-end="url(#f2)"/>
        <text class="tm" x="330" y="134" text-anchor="middle">números de pieza → sufijo exacto (hasta 4)</text>

        <!-- carril del estado y el reloj -->
        <rect class="caja" x="150" y="228" width="130" height="60" rx="8"/>
        <text class="t" x="215" y="254" text-anchor="middle">ĥ = norma(h)</text>
        <text class="ts" x="215" y="274" text-anchor="middle">estado normalizado</text>
        <rect class="caja" x="320" y="228" width="180" height="60" rx="8"/>
        <text class="t" x="410" y="254" text-anchor="middle">reloj propio</text>
        <text class="ts" x="410" y="274" text-anchor="middle">β ≥ 0 · α · B = Σβ</text>
        <line class="lin" x1="110" y1="258" x2="148" y2="258" marker-end="url(#f2)"/>
        <line class="lin" x1="280" y1="258" x2="318" y2="258" marker-end="url(#f2)"/>

        <path class="lin" d="M215,228 L215,165 L580,165 L580,114" marker-end="url(#f2)"/>
        <text class="tm" x="372" y="160" text-anchor="middle">confirmación (contexto)</text>
        <path class="lin" d="M440,228 L440,195 L640,195 L640,114" marker-end="url(#f2)"/>
        <text class="tm" x="540" y="190" text-anchor="middle">núcleo de tiempo</text>

        <!-- carril de repeticion -->
        <rect class="caja-s" x="150" y="404" width="160" height="60" rx="8"/>
        <text class="t" x="230" y="430" text-anchor="middle">grupos de piezas</text>
        <text class="ts" x="230" y="450" text-anchor="middle">de 1, 2, 3 y 4</text>
        <rect class="caja-s" x="340" y="404" width="160" height="60" rx="8"/>
        <text class="t" x="420" y="430" text-anchor="middle">escaneo asociativo</text>
        <text class="ts" x="420" y="450" text-anchor="middle">trabajo O(N)</text>
        <rect class="caja-s" x="530" y="404" width="160" height="60" rx="8"/>
        <text class="t" x="610" y="430" text-anchor="middle">vistos · Hawkes</text>
        <text class="ts" x="610" y="450" text-anchor="middle">racha ℓ</text>
        <line class="lin-s" x1="110" y1="434" x2="148" y2="434" marker-end="url(#f2s)"/>
        <line class="lin-s" x1="310" y1="434" x2="338" y2="434" marker-end="url(#f2s)"/>
        <line class="lin-s" x1="500" y1="434" x2="528" y2="434" marker-end="url(#f2s)"/>
        <line class="lin" x1="420" y1="288" x2="420" y2="402" marker-end="url(#f2)"/>
        <text class="tm" x="428" y="350">reloj</text>

        <!-- puerta y suma -->
        <rect class="caja" x="750" y="300" width="130" height="60" rx="8"/>
        <text class="t" x="815" y="326" text-anchor="middle">puerta</text>
        <text class="ts" x="815" y="346" text-anchor="middle">entre 0 y 1 · usa h</text>
        <line class="lin" x1="790" y1="112" x2="790" y2="298" marker-end="url(#f2)"/>
        <text class="tm" x="798" y="210">confianza</text>
        <text class="tm" x="798" y="225">de la búsqueda</text>
        <path class="lin-s" d="M690,434 L840,434 L840,362" marker-end="url(#f2s)"/>
        <text class="tsig" x="765" y="482" text-anchor="middle">cuánto y cuán seguido se repite</text>

        <rect class="caja-a" x="900" y="170" width="125" height="70" rx="8"/>
        <text class="t" x="962" y="198" text-anchor="middle">h′ = h +</text>
        <text class="ts" x="962" y="219" text-anchor="middle">puerta · copiado</text>
        <path class="lin-a" d="M850,82 L962,82 L962,168" marker-end="url(#f2a)"/>
        <path class="lin" d="M880,330 L962,330 L962,242" marker-end="url(#f2)"/>
        <text class="tm" x="922" y="324" text-anchor="middle">puerta</text>
      </svg>
